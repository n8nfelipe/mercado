apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: mercado-data
  labels:
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/part-of: mercado
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
        app.kubernetes.io/part-of: mercado
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mc
          image: rancher/mirrored-minio-mc:RELEASE.2023-06-28T21-54-17Z
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio.mercado-data.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
              mc mb --ignore-existing local/mercado-listings &&
              mc version enable local/mercado-listings
          env:
            - name: HOME
              value: /tmp
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: mercado-secrets
                  key: minio-access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mercado-secrets
                  key: minio-secret-key
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: tmp
          emptyDir: {}
