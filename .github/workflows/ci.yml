name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - name: Tests
        working-directory: backend
        run: go test ./...
      - name: Typecheck
        working-directory: backend
        run: go vet ./...

  lint:
    name: Backend lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
          working-directory: backend

  frontend:
    name: Frontend lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm --filter @mercado/api-client --filter @mercado/ui build
      - name: Lint
        run: pnpm -r --if-present lint
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Tests
        run: pnpm -r --if-present test

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 12.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Fetch base branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"
      - name: Validate syntax and compatibility
        env:
          API_BASE_REF: origin/${{ github.base_ref }}
        run: ./scripts/api-contract-check.sh

  images:
    name: Build, SBOM and vulnerability scan
    runs-on: ubuntu-latest
    needs: [backend, lint, frontend, contract]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -t mercado-api:ci -f backend/Dockerfile backend
      - name: Build web image
        run: docker build -t mercado-web:ci -f frontend/apps/web/Dockerfile .
      - name: SBOM da API
        uses: anchore/sbom-action@v0
        with:
          image: mercado-api:ci
          format: spdx-json
          artifact-name: sbom-api.spdx.json
      - name: SBOM da web
        uses: anchore/sbom-action@v0
        with:
          image: mercado-web:ci
          format: spdx-json
          artifact-name: sbom-web.spdx.json
      - name: Scan da API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mercado-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
      - name: Scan da web
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mercado-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
