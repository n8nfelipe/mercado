apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: mercado
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: mercado
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mercado
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: mercado
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 3000
      targetPort: http
