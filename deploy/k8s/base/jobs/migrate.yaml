apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: mercado
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: mercado
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: mercado
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: migrate
          image: mercado-api:local
          imagePullPolicy: IfNotPresent
          command: ["/app/migrate", "-direction", "up"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mercado-secrets
                  key: database-url
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
