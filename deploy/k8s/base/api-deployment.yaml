apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: mercado
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: mercado
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: mercado
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: api
          image: mercado-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADDR
              value: ":8080"
            - name: SERVICE_NAME
              value: mercado-api
            - name: SERVICE_VERSION
              value: local
            - name: GIT_COMMIT
              value: local
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mercado-secrets
                  key: database-url
            - name: REDIS_ADDR
              value: redis.mercado-data.svc.cluster.local:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mercado-secrets
                  key: redis-password
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger.mercado-observability.svc.cluster.local:4317
            - name: LOG_LEVEL
              value: info
            - name: TRUST_PROXY
              value: "true"
            - name: MINIO_ENDPOINT
              value: minio.mercado-data.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mercado-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mercado-secrets
                  key: minio-secret-key
            - name: MINIO_BUCKET
              value: mercado-listings
            - name: MINIO_USE_SSL
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
