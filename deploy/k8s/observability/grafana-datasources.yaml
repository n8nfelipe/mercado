apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: mercado-observability
  labels:
    app.kubernetes.io/part-of: mercado
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.mercado-observability.svc.cluster.local:80
        isDefault: true
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger.mercado-observability.svc.cluster.local:16686
