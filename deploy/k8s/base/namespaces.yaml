apiVersion: v1
kind: Namespace
metadata:
  name: mercado
  labels:
    app.kubernetes.io/part-of: mercado
---
apiVersion: v1
kind: Namespace
metadata:
  name: mercado-data
  labels:
    app.kubernetes.io/part-of: mercado
---
apiVersion: v1
kind: Namespace
metadata:
  name: mercado-observability
  labels:
    app.kubernetes.io/part-of: mercado
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mercado-quota
  namespace: mercado
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "3"
    limits.memory: 4Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mercado-limits
  namespace: mercado
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "2"
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mercado-data-quota
  namespace: mercado-data
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "3"
    limits.memory: 4Gi
    pods: "10"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mercado-data-limits
  namespace: mercado-data
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "2"
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: 500m
        memory: 1Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mercado-observability-quota
  namespace: mercado-observability
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "3"
    limits.memory: 3Gi
    pods: "15"
    persistentvolumeclaims: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: mercado-observability-limits
  namespace: mercado-observability
spec:
  limits:
    - type: Container
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "2"
        memory: 2Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
